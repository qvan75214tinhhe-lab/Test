# Build APK TungTom tren GitHub Actions (mien phi).
# Dat file nay o .github/workflows/apk2.yml, userscript (TungTom_user.js) o thu muc goc repo.
# Ket qua: tab Actions > lan chay > Artifacts (zip) va muc Releases (tai thang file .apk).
name: Build TungTom APK v2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Chap nhan license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Tao project Android tu script
        run: |
          set -e
          SCRIPT=$(ls ./*.user.js ./*_user.js 2>/dev/null | head -1)
          if [ -z "$SCRIPT" ]; then echo "Khong thay file userscript (*.user.js hoac *_user.js) o thu muc goc repo"; exit 1; fi
          echo "Dung script: $SCRIPT"
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/tungtom/pokesurvivor
          cp "$SCRIPT" app/src/main/assets/tungtom.user.js
          cat > settings.gradle <<'PSEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TungTom'
          include ':app'
          PSEOF
          cat > build.gradle <<'PSEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          PSEOF
          cat > gradle.properties <<'PSEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PSEOF
          cat > app/build.gradle <<'PSEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tungtom.pokesurvivor'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tungtom.pokesurvivor'
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName '1.12.0'
              }

              // Khoa co dinh: moi ban build cung chu ky nen cai de len ban cu duoc
              signingConfigs {
                  debug {
                      storeFile file('tungtom.keystore')
                      storePassword 'tungtom'
                      keyAlias 'tungtom'
                      keyPassword 'tungtom'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // addDocumentStartJavaScript: chay script truoc moi script cua trang, giong userscript manager
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          PSEOF
          cat > app/src/main/AndroidManifest.xml <<'PSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="TungTom"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode|density"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PSEOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'PSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D0F1E"
                  android:pathData="M18,0 h72 a18,18 0 0 1 18,18 v72 a18,18 0 0 1 -18,18 h-72 a18,18 0 0 1 -18,-18 v-72 a18,18 0 0 1 18,-18 z" />
              <path
                  android:fillColor="#22D3EE"
                  android:pathData="M28,30 h7 v48 h-7 z" />
              <path
                  android:fillColor="#A78BFA"
                  android:pathData="M42,30 L84,54 L42,78 Z" />
          </vector>
          PSEOF
          cat > app/src/main/java/com/tungtom/pokesurvivor/MainActivity.java <<'PSEOF'
          package com.tungtom.pokesurvivor;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.webkit.ScriptHandler;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Set;

          /**
           * Mo game trong WebView va chay userscript TungTom (assets/tungtom.user.js) truoc script cua trang.
           * Nut tron ON/OFF (keo di dau cung duoc) bat/tat tool: OFF = khong chen script, tai lai trang, game chay nguyen ban.
           * Man hinh chao hien den khi trang tai xong. Luon man hinh ngang, giu man hinh sang.
           */
          public class MainActivity extends Activity {
              private static final String HOME = "https://pokesurvivor.com/";
              private static final String[] HOSTS = {"pokesurvivor.com", "www.pokesurvivor.com", "pokesurvivor.doofcraft.com"};

              private WebView web;
              private FrameLayout root;
              private TextView toggle;
              private View splash;
              private boolean minDone, loaded, enabled = true, docStart;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;
              private ScriptHandler startHandler;
              private String script = "";

              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("tungtom", MODE_PRIVATE);
                  enabled = prefs.getBoolean("enabled", true);
                  script = readAsset("tungtom.user.js");

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);

                  toggle = new TextView(this);
                  toggle.setGravity(Gravity.CENTER);
                  toggle.setTextColor(Color.WHITE);
                  toggle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  toggle.setTypeface(Typeface.DEFAULT_BOLD);
                  toggle.setAlpha(0.8f);
                  toggle.setOnTouchListener(new View.OnTouchListener() {
                      float offX, offY, downX, downY;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  offX = v.getX() - e.getRawX();
                                  offY = v.getY() - e.getRawY();
                                  downX = e.getRawX();
                                  downY = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (Math.abs(e.getRawX() - downX) > dp(6) || Math.abs(e.getRawY() - downY) > dp(6)) moved = true;
                                  if (moved) {
                                      v.setX(Math.max(0, Math.min(root.getWidth() - v.getWidth(), e.getRawX() + offX)));
                                      v.setY(Math.max(0, Math.min(root.getHeight() - v.getHeight(), e.getRawY() + offY)));
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) flip();
                                  return true;
                              default:
                                  return false;
                          }
                      }
                  });

                  root = new FrameLayout(this);
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(dp(44), dp(44), Gravity.BOTTOM | Gravity.START);
                  lp.setMargins(dp(10), 0, 0, dp(10));
                  root.addView(toggle, lp);
                  if (state == null) showSplash();
                  setContentView(root);
                  paintToggle();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  applyInjection();

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          // WebView cu: chay script ngay khi trang bat dau tai
                          if (enabled && !docStart && isGame(url) && !script.isEmpty()) view.evaluateJavascript(script, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          loaded = true;
                          maybeHideSplash();
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String sc = u.getScheme();
                          if ("http".equals(sc) || "https".equals(sc)) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          recreate();
                          return true;
                      }
                  });

                  web.loadUrl(HOME);
              }

              private void showSplash() {
                  TextView logo = new TextView(this);
                  logo.setText("TungTom");
                  logo.setTextSize(TypedValue.COMPLEX_UNIT_SP, 40);
                  logo.setTypeface(Typeface.create(Typeface.SANS_SERIF, Typeface.BOLD_ITALIC));
                  float w = logo.getPaint().measureText("TungTom");
                  logo.getPaint().setShader(new LinearGradient(0, 0, w, 0, 0xFFA78BFA, 0xFF22D3EE, Shader.TileMode.CLAMP));

                  ImageView icon = new ImageView(this);
                  icon.setImageResource(R.drawable.tungtom_icon);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.addView(logo, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(dp(64), dp(64));
                  ip.setMargins(dp(14), 0, 0, 0);
                  row.addView(icon, ip);

                  FrameLayout screen = new FrameLayout(this);
                  screen.setBackgroundColor(0xFF0D0F1E);
                  screen.setClickable(true);
                  screen.addView(row, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
                  root.addView(screen, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  splash = screen;

                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          minDone = true;
                          maybeHideSplash();
                      }
                  }, 1600);
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          hideSplash();
                      }
                  }, 8000);
              }

              private void maybeHideSplash() {
                  if (minDone && loaded) hideSplash();
              }

              private void hideSplash() {
                  final View screen = splash;
                  if (screen == null) return;
                  splash = null;
                  screen.animate().alpha(0f).setDuration(400).withEndAction(new Runnable() {
                      @Override
                      public void run() {
                          root.removeView(screen);
                      }
                  }).start();
              }

              /** Dang ky (lai) script chay tu dau trang, hoac go bo khi tool dang tat. */
              private void applyInjection() {
                  if (startHandler != null) {
                      startHandler.remove();
                      startHandler = null;
                  }
                  docStart = false;
                  if (!enabled || script.isEmpty()) return;
                  if (!WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) return;
                  Set<String> origins = new HashSet<>();
                  for (String h : HOSTS) origins.add("https://" + h);
                  try {
                      startHandler = WebViewCompat.addDocumentStartJavaScript(web, script, origins);
                      docStart = true;
                  } catch (RuntimeException e) {
                      startHandler = null;
                  }
              }

              private void flip() {
                  enabled = !enabled;
                  prefs.edit().putBoolean("enabled", enabled).apply();
                  applyInjection();
                  paintToggle();
                  Toast.makeText(this, enabled ? "TungTom: BAT, dang tai lai trang" : "TungTom: TAT, game chay binh thuong", Toast.LENGTH_SHORT).show();
                  web.reload();
              }

              private void paintToggle() {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(enabled ? 0xFF16A34A : 0xFF6B7280);
                  bg.setStroke(dp(2), 0xCCFFFFFF);
                  toggle.setBackground(bg);
                  toggle.setText(enabled ? "ON" : "OFF");
              }

              private boolean isGame(String url) {
                  try {
                      String h = Uri.parse(url).getHost();
                      return h != null && Arrays.asList(HOSTS).contains(h);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toString("UTF-8");
                  } catch (Exception e) {
                      return "";
                  }
              }

              private int dp(int v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          PSEOF
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/drawable/tungtom_icon.xml
          keytool -genkeypair -noprompt -keystore app/tungtom.keystore -storepass tungtom -keypass tungtom -alias tungtom -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TungTom"
          echo "Da tao xong project"

      - name: Build APK
        run: gradle assembleDebu
